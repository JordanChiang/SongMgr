name: Release

# 推送版本號 tag (例如 2.12.0) 時，自動發佈加歌程式到 GitHub Release (作法參考 UltimateKtvPublic)。
#   Phase 1：dotnet publish (FolderProfile, x86 單檔) + 補 Codec_x86\，用 tools/pack-release.ps1 打包元件 zip + update.json。
#   Phase 2：把 exe 送 VirusTotal，結果附加到 Release notes (需 VT_API_KEY secret；失敗不中斷發佈)。
# UltimateKtvPublic 的 release workflow 會抓本 repo「最新 release」的 SongMgr_App_*.zip 併入，
# 所以這裡發出的 release 不可以是 pre-release / draft (自動更新與 UltimateKtv 都會略過)。
# 手動觸發可勾 dry_run 試跑：照常 build/打包，並照樣跑 VirusTotal，但不建立或更動任何 Release；
# VT 結果改寫進該 run 的 Summary 頁、附檔上傳為 workflow artifact (用來確認新 code commit 的 VT 掃描與產出)。
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: '要發佈的版本號 tag (例如 2.12.0，要和 AssemblyFileVersion 一樣)'
        required: true
      dry_run:
        description: '試跑：build/打包 + VirusTotal (結果寫在 run Summary)，但不建立或更動 Release；附檔上傳為 artifact'
        type: boolean
        default: false

permissions:
  contents: write

env:
  PUBLISH_DIR: CrazyKTV_SongMgr/Publish

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 決定 tag
        id: ver
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.tag }}' } else { '${{ github.ref_name }}' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "發佈 tag: $tag"

      # update.json 的下載網址用 tag 組成、程式比對版本用 exe 的檔案版本，兩者不一致自動更新會下載失敗。
      # 在 build 前就擋下，避免白跑。
      - name: 檢查 tag 與 AssemblyFileVersion 一致
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $info = Get-Content -Raw CrazyKTV_SongMgr/Properties/AssemblyInfo.cs
          $m = [regex]::Match($info, '(?m)^\s*\[assembly:\s*AssemblyFileVersion\("([^"]+)"\)\]')
          if (-not $m.Success) { throw 'AssemblyInfo.cs 找不到 AssemblyFileVersion' }
          $ver = $m.Groups[1].Value
          if ($ver -ne $tag) { throw "tag ($tag) 與 AssemblyFileVersion ($ver) 不一致，請先改 CrazyKTV_SongMgr/Properties/AssemblyInfo.cs" }
          Write-Host "版本一致: $ver"

      # 與本機「VS 發佈 FolderProfile」相同：x86、framework-dependent、單檔、原生 DLL 不包進 exe (防毒誤判，見 tools/README.md)。
      - name: 發佈加歌程式 (x86)
        shell: pwsh
        run: dotnet publish CrazyKTV_SongMgr/SongMgr.csproj -p:PublishProfile=FolderProfile --nologo -v minimal

      # csproj 的 PostBuild (xcopy Codec_x86) 在發佈時不執行 (Condition PublishProtocol == '')，
      # 本機 Publish\ 裡的 Codec_x86\ 是手動放的；CI 從 repo 補上。
      - name: 補上 Codec_x86
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force CrazyKTV_SongMgr/Codec_x86 "$env:PUBLISH_DIR/Codec_x86"
          Write-Host ("Codec_x86: {0} 個檔案" -f (Get-ChildItem "$env:PUBLISH_DIR/Codec_x86" -File).Count)

      - name: 驗證發佈產出完整
        shell: pwsh
        run: |
          $p = $env:PUBLISH_DIR
          $need = @(
            'CrazyKTV_SongMgr.exe',
            'SQLite.Interop.dll',
            'SongMgr/CrazySongMgr.mdb',
            'SongMgr/CrazySongEmpty.mdb',
            'SongMgr/Custom.lang',
            'Codec_x86/CrazyKTV_MediaKit.dll',
            'Codec_x86/DirectShowLib-2005.dll',
            'Codec_x86/EVRPresenter32.dll',
            'Codec_x86/LAVSplitter.ax',
            'Codec_x86/LAVVideo.ax',
            'Codec_x86/LAVAudio.ax',
            'Tools/ffmpeg.exe',
            'Tools/ffprobe.exe'
          )
          $missing = $need | Where-Object { -not (Test-Path (Join-Path $p $_)) }
          if ($missing) { throw "發佈產出缺檔:`n$($missing -join "`n")" }
          $fv = (Get-Item (Join-Path $p 'CrazyKTV_SongMgr.exe')).VersionInfo.FileVersion
          if ($fv -ne '${{ steps.ver.outputs.tag }}') { throw "exe 檔案版本 ($fv) 與 tag 不一致" }
          Write-Host "發佈產出檢查通過 (exe $fv)。"

      # 與上一版 (最新 release) update.json 相同的元件不重新打包，清單直接指向舊附檔；
      # 輸出在 Publish\ReleaseAssets\<版本>\，裡面有什麼就上傳什麼。
      - name: 打包 Release 附檔 (元件 zip + 完整包 + update.json)
        shell: pwsh
        run: ./tools/pack-release.ps1 -PublishDir $env:PUBLISH_DIR -Tag ${{ steps.ver.outputs.tag }}

      - name: 建立 GitHub Release 並上傳附檔
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: ${{ env.PUBLISH_DIR }}/ReleaseAssets/${{ steps.ver.outputs.tag }}/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          draft: false
          make_latest: true

      # Phase 2：exe 送 VirusTotal。結果一律寫進該 run 的 Summary 頁；
      # 正式發佈 (非 dry_run) 時另外附加到 Release notes。錯誤 (無 key / 逾時 / 速率限制) 都不中斷。
      # 注意：VT 上傳會讓檔案對 VT 使用者可見；dry_run 掃的是未發佈 build，等於提前公開 (內容與正式發佈幾乎一樣)。
      # HA gate：對照 tools/vt-baseline.json 白名單，只在某 exe 出現白名單以外的新命中時，
      # 在 Summary 標記「建議送 Hybrid Analysis」並附上本機 scan.sh 指令 (不自動送)。
      - name: VirusTotal 掃描
        continue-on-error: true
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not $env:VT_API_KEY) { Write-Host 'VT: 未設定 VT_API_KEY secret，略過。'; exit 0 }
          $vt = Join-Path $env:RUNNER_TEMP 'vt.md'
          # 送發佈資料夾根目錄所有自家 exe (目前只有 CrazyKTV_SongMgr.exe)；新增 exe 會自動納入。
          # Tools\ 下的第三方 ffmpeg/ffplay/ffprobe 不送 (非自家且體積大)。
          $exes = Get-ChildItem $env:PUBLISH_DIR -Filter *.exe -File | Select-Object -ExpandProperty FullName
          Write-Host ("VT 掃描對象: " + (($exes | Split-Path -Leaf) -join ', '))
          # -Baseline 啟用 HA gate (只標記、不自動送)；-FlagsOut 吐出是否有白名單外命中供 log
          $flags = Join-Path $env:RUNNER_TEMP 'vt-flags.json'
          ./tools/vt-scan.ps1 -Files $exes -OutFile $vt -Baseline tools/vt-baseline.json -FlagsOut $flags | Out-Null
          if (-not (Test-Path $vt)) { Write-Host 'VT: 無結果，略過。'; exit 0 }
          if (Test-Path $flags) {
            $g = Get-Content -Raw $flags | ConvertFrom-Json
            if ($g.anyFlagged) { Write-Host ('VT gate: 有白名單外命中，建議送 HA -> ' + ($g.flagged -join ', ')) }
            else { Write-Host 'VT gate: 無白名單外命中，不需 HA。' }
          }
          # 一律寫進該 run 的 Summary 頁 (dry_run 時這就是查看掃描結果的地方)
          Get-Content -Raw $vt | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if ('${{ github.event.inputs.dry_run }}' -eq 'true') { Write-Host 'VT: dry_run，結果只寫 Summary、不動 Release。'; exit 0 }
          # 正式發佈：附加到 Release notes
          $tag = '${{ steps.ver.outputs.tag }}'
          $body = gh release view $tag --json body -q .body
          $combined = Join-Path $env:RUNNER_TEMP 'notes.md'
          ($body + "`n`n" + (Get-Content -Raw $vt)) | Set-Content -Path $combined -Encoding utf8
          gh release edit $tag --notes-file $combined
          Write-Host 'VT: 已附加到 release notes。'

      # 試跑 (dry_run)：不動任何 Release，改把打包好的附檔上傳為 workflow artifact 供下載檢查。
      - name: 試跑：上傳附檔為 artifact
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ReleaseAssets-${{ steps.ver.outputs.tag }}
          path: ${{ env.PUBLISH_DIR }}/ReleaseAssets/${{ steps.ver.outputs.tag }}/
          if-no-files-found: error
